name: PDFLeo checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b(?![^>]*\bsrc\s*=)(?![^>]*\btype\s*=\s*["\']application\/ld\+json["\'])[^>]*>([\s\S]*?)<\/script>/gi)].map(m => m[1]);
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          fs.writeFileSync('/tmp/pdfleo-inline.js', scripts.join('\n;\n'));
          const cards = [...html.matchAll(/data-tool="([^"]+)"/g)].map(m => m[1]);
          const configStart = html.indexOf('const config={');
          const configEnd = html.indexOf('};\nlet activeFilter', configStart);
          if (configStart < 0 || configEnd < 0) throw new Error('Tool config block not found');
          const config = html.slice(configStart, configEnd);
          const keys = new Set([...config.matchAll(/^\s*([a-zA-Z0-9]+):\{/gm)].map(m => m[1]));
          const missing = [...new Set(cards)].filter(k => !keys.has(k));
          if (missing.length) throw new Error('Tool cards missing config: ' + missing.join(', '));
          console.log('Checked ' + new Set(cards).size + ' tool cards and found config for all of them.');
          NODE
      - name: Validate JavaScript syntax
        run: node --check /tmp/pdfleo-inline.js
